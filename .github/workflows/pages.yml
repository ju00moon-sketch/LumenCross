name: Deploy status page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A cancelled run leaves its Pages deployment queued on GitHub's side and the
# next deployment then fails with "try again later"; queue runs instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # The deployment step asks for the artifact right after the upload and sometimes gets an
      # empty list ("No artifacts named github-pages were found"); give the listing time.
      - name: Wait for the artifact listing
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
